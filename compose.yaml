services:
  localstack:
    container_name: lab2-localstack
    image: localstack/localstack:latest

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - DEBUG=0

    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"